# 臨時：從 GitHub 的伺服器測試能不能連到 MUJI 日本官網（探勘用，合併前刪除）
name: 探測 MUJI 日本官網
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 連線測試
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          for u in \
            https://www.muji.com/robots.txt \
            https://www.muji.com/jp/ja/store \
            https://www.muji.com/jp/ja/store/cmdty/detail/4547315345076 \
            https://www.muji.com/jp/ja/store/cmdty/detail/4547315759071 \
            "https://www.muji.com/jp/ja/store/search?keyword=4547315992959"; do
            code=$(curl -sS -L -o page.html -w "%{http_code} %{size_download} %{url_effective}" --max-time 30 -A "$UA" "$u" 2>&1 | tail -1)
            echo "=== $u -> $code"
            if [ "$u" = https://www.muji.com/robots.txt ]; then head -c 3000 page.html; fi
            grep -oE '(__NEXT_DATA__|application/ld\+json|"price"[^,]{0,40}|[0-9,]+円|税込[^<]{0,30}|api/[a-zA-Z0-9/_\-]{3,60})' page.html | sort | uniq -c | sort -rn | head -25
            echo
            sleep 2
          done
