name: 每日資料更新

on:
  schedule:
    - cron: "37 21 * * *" # 台灣時間每天 05:37（避開整點的排程壅塞）
  workflow_dispatch:
    inputs:
      force_fail:
        description: "測試用：讓一個品牌故意失敗"
        type: choice
        options: [none, uq, gu, muji, nitori, gw, niko, montbell, uq_jp, gu_jp, fx]
        default: none
      muji_pdp_limit:
        description: "這次最多抓幾個 MUJI 商品頁補 JAN"
        default: "500"
      test_autofix:
        description: "故意失敗時也測試自動修復（會用到 Claude 額度）"
        type: boolean
        default: false
  pull_request:
    paths-ignore: ["docs/**", "*.md"]

concurrency:
  group: update-data-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 單元測試（爬蟲）
        run: python -m unittest -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 單元測試（前端計算與搜尋）
        run: node --test web/tests/*.test.mjs

  # PR：只抓少量資料，確認從 GitHub 的伺服器連得上三個官網與匯率來源；不發布、不開 Issue
  connectivity:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 小量抓取
        run: python -m crawler.run --prev /nonexistent --out out --report report.json --sample --muji-pdp-limit 3 --pdp-limit 3 --montbell-limit 3
      - name: 檢查結果
        run: |
          cat report.json
          python - <<'EOF'
          import json, sys
          r = json.load(open("report.json"))
          bad = [x for x in r["results"] if not x["ok"]]
          for x in bad:
              print(f"::error::{x['brand']} 失敗：{x['errors']}")
          sys.exit(1 if bad else 0)
          EOF

  update:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      issues: write
    outputs:
      new_issues: ${{ steps.issues.outputs.new_issues || '[]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 取得上一份資料（data 分支）
        run: |
          mkdir -p prev
          if git ls-remote --exit-code origin refs/heads/data >/dev/null; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C prev
          fi
          ls -la prev

      - name: 抓取並做健康檢查
        env:
          FORCE_FAIL: ${{ inputs.force_fail }}
          MUJI_PDP_LIMIT: ${{ inputs.muji_pdp_limit || '500' }}
        run: |
          args=""
          if [ -n "$FORCE_FAIL" ] && [ "$FORCE_FAIL" != "none" ]; then args="--force-fail $FORCE_FAIL"; fi
          python -m crawler.run --prev prev --out out --report report.json --muji-pdp-limit "$MUJI_PDP_LIMIT" $args
          cat report.json

      - name: 發布到 data 分支（覆蓋，不保留歷史）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "資料更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: 開／更新／關閉 Issue
        id: issues
        if: always() && hashFiles('report.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m crawler.issues report.json

  # 新開「資料更新失敗」Issue 時，讓 Claude 試著修爬蟲。有修改就推到 autofix/ 分支並在 Issue 附上建立 PR 的連結。
  # 需要在儲存庫 Secrets 設定 CLAUDE_CODE_OAUTH_TOKEN（或 ANTHROPIC_API_KEY）；沒設定就略過。
  autofix:
    needs: update
    if: >-
      needs.update.outputs.new_issues != '[]' &&
      (github.event_name == 'schedule' || inputs.force_fail == 'none' || inputs.test_autofix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.update.outputs.new_issues) }}
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      BRAND: ${{ matrix.issue.brand }}
      ISSUE: ${{ matrix.issue.number }}
      ERRORS: ${{ toJSON(matrix.issue.errors) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 沒有設定 Claude 金鑰
        if: env.HAS_CLAUDE != 'true'
        run: echo "::notice::未設定 CLAUDE_CODE_OAUTH_TOKEN 或 ANTHROPIC_API_KEY，略過自動修復。"
      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_CLAUDE == 'true'
        with:
          python-version: "3.12"
      - name: Claude 嘗試修復爬蟲
        if: env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
            --allowedTools Read,Edit,Write,Glob,Grep,Bash(python:*),Bash(python3:*),Bash(curl:*),Bash(git diff:*),Bash(git status:*),Bash(ls:*),Bash(cat:*)
          prompt: |
            你在幫一個每日比價爬蟲修 bug（請用繁體中文寫說明）。
            每日資料更新時，品牌「${{ matrix.issue.brand }}」失敗了，錯誤如下：
            ${{ toJSON(matrix.issue.errors) }}

            背景：先讀 SPEC.md「爬蟲與自動維護」「資料規格」和 docs/recon.md、docs/recon-2.md、docs/recon-3.md，爬蟲在 crawler/。
            1. 用小量抓取重現：python -m crawler.run --brands ${{ matrix.issue.key }} --sample --prev /nonexistent --out /tmp/out --report /tmp/report.json --muji-pdp-limit 3 --pdp-limit 3 --montbell-limit 3
               如果錯誤是「手動觸發的測試失敗（--force-fail）」，代表這是測試，不用修，直接到第 4 步說明。
            2. 找出原因（例如官網 API 欄位或網址改了），只修改 crawler/ 和 tests/ 裡的程式。
               規則：只用 robots.txt 允許的端點、請求間隔至少 1 秒、輸出格式不變、不要動 data 或 web/。
               不要放寬健康檢查來讓錯誤消失；資料真的有問題就不要修改程式。
            3. 修完重跑第 1 步確認成功，再跑 python -m unittest，全部要通過。
            4. 最後把結果寫到 autofix_summary.md：原因、改了什麼、測試結果；如果修不了或需要人決定，說明原因與建議。
      - name: 推到 autofix 分支並在 Issue 留言
        if: env.HAS_CLAUDE == 'true' && always()
        run: |
          summary="$(cat autofix_summary.md 2>/dev/null || echo '（Claude 沒有留下說明，請看執行紀錄）')"
          rm -f autofix_summary.md
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$(git status --porcelain -- crawler tests)" ]; then
            branch="autofix/$(echo "$BRAND" | tr A-Z a-z)-${{ github.run_id }}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add crawler tests
            git commit -q -m "自動修復 $BRAND 爬蟲（#$ISSUE）"
            git push -q origin "$branch"
            link="${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
            body="$(printf '🤖 自動修復嘗試\n\n%s\n\n修改已推到分支 `%s`。請看過後 **[建立 PR](%s)** 並合併；隔天更新成功會自動關閉這個 Issue。\n\n執行紀錄：%s' "$summary" "$branch" "$link" "$run_url")"
          else
            body="$(printf '🤖 自動修復嘗試：沒有修改程式。\n\n%s\n\n執行紀錄：%s' "$summary" "$run_url")"
          fi
          gh issue comment "$ISSUE" --body "$body"
