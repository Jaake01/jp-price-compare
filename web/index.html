<!doctype html>

<body>
<div class="app">
  <header class="search-bar" id="searchBar">
    <h1 class="title">日系比價</h1>
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6470" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="q" class="sr-only">搜尋商品編號或關鍵字</label>

      </button>

    <div class="chips" id="chips" role="group" aria-label="品牌">

      <button type="button" class="chip" data-brand="UQ" aria-pressed="false">UNIQLO</button>
      <button type="button" class="chip" data-brand="GU" aria-pressed="false">GU</button>
      <button type="button" class="chip" data-brand="MUJI" aria-pressed="false">MUJI</button>
