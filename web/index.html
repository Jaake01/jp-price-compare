<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日牌比價</title>
<meta name="description" content="UNIQLO・GU・MUJI・宜得利・GLOBAL WORK・niko and ...・mont-bell 日本吊牌價與台灣官網售價比價">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日牌比價">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <header class="search-bar" id="searchBar">
    <h1 class="title">日牌比價</h1>
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6470" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="q" class="sr-only">搜尋商品編號或關鍵字</label>
      <input id="q" type="search" placeholder="輸入商品編號或關鍵字" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button type="button" id="scan" class="icon-btn scan-btn" aria-label="掃描條碼" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15191E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><path d="M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>
      </button>
      <button type="button" id="clear" class="icon-btn clear-btn" aria-label="清除搜尋" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6470" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="品牌">
      <button type="button" class="chip" data-brand="ALL" aria-pressed="true">全部</button>
      <button type="button" class="chip" data-brand="UQ" aria-pressed="false">UNIQLO</button>
      <button type="button" class="chip" data-brand="GU" aria-pressed="false">GU</button>
      <button type="button" class="chip" data-brand="MUJI" aria-pressed="false">MUJI</button>
      <button type="button" class="chip" data-brand="NITORI" aria-pressed="false">宜得利</button>
      <button type="button" class="chip" data-brand="GW" aria-pressed="false">GLOBAL WORK</button>
      <button type="button" class="chip" data-brand="NIKO" aria-pressed="false">niko and ...</button>
      <button type="button" class="chip" data-brand="MB" aria-pressed="false">mont-bell</button>
    </div>
  </header>
  <main class="content" id="content"></main>
  <nav class="tabbar" id="tabbar" aria-label="分頁">
    <button type="button" class="tab" data-tab="compare" aria-pressed="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>比價</span>
    </button>
    <button type="button" class="tab" data-tab="coupons" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4z"/><path d="M14 5v14" stroke-dasharray="2 2.5"/></svg>
      <span>優惠券</span>
    </button>
  </nav>
  <div class="embed" id="embed" hidden role="dialog" aria-labelledby="embedTitle">
    <div class="embed-top">
      <button type="button" class="icon-btn" id="embedBack" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15191E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span id="embedTitle"></span>
      <a class="c-btn" id="embedOpen" target="_blank" rel="noopener">在瀏覽器開啟</a>
    </div>
    <p class="embed-hint" id="embedHint" hidden>頁面一直沒出現？可能是網站不允許在 App 裡顯示，請按右上「在瀏覽器開啟」。</p>
    <div class="embed-frame" id="embedFrame"></div>
  </div>
  <div class="scanner" id="scanner" hidden role="dialog" aria-label="掃描條碼">
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-frame" aria-hidden="true"></div>
    <p class="scan-hint" id="scanHint">把吊牌上的條碼對準框內</p>
    <button type="button" class="scan-cancel" id="scanCancel">取消</button>
  </div>
</div>
</body>
</html>
