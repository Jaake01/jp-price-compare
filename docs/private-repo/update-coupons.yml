# 優惠券清單自動更新（放在私人 repo，資料不公開）
# 每週檢查一次：滿 90 天、有券在上次抓取後過期、或上次失敗，才真的去 MATCHA 抓。
# 爬蟲程式在公開 repo jp-price-compare（crawler/coupons.py），這裡只存結果 coupons.json。
name: 更新優惠券

on:
  schedule:
    - cron: "23 1 * * 1" # 每週一 台灣時間 09:23
  workflow_dispatch:
    inputs:
      force:
        description: "不管日期，直接重新抓"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coupons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Jaake01/jp-price-compare
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 判斷要不要重新抓
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "need=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          need=$(cd app && python -m crawler.coupons --check ../coupons.json)
          echo "need=$need" >> "$GITHUB_OUTPUT"

      - name: 抓取（失敗時保留上一版，只記錄失敗）
        id: crawl
        if: steps.check.outputs.need == 'yes'
        run: |
          if (cd app && python -m crawler.coupons --prev ../coupons.json --out ../coupons.json); then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
          fi

      - name: 存檔
        if: steps.check.outputs.need == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coupons.json
          git diff --cached --quiet || git commit -q -m "優惠券更新 $(date -u +%Y-%m-%d)"
          git push

      - name: 抓取失敗時讓這次執行標成失敗（GitHub 會寄信通知）
        if: steps.crawl.outputs.ok == 'no'
        run: |
          echo "::error::優惠券抓取失敗，已保留上一版，App 會顯示「更新失敗」。"
          exit 1
